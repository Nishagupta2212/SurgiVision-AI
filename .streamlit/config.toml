[server]
# Maximum upload size in MB. Kept modest so short clips fit within free cloud hosting memory.
maxUploadSize = 200

[browser]
gatherUsageStats = false

# Dark "surgical console" theme: low-glare background with a medical teal accent.
[theme]
base = "dark"
primaryColor = "#2DD4BF"
backgroundColor = "#0A0F1A"
secondaryBackgroundColor = "#111A2B"
textColor = "#E2E8F0"
font = "sans serif"
